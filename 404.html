    <title>Nicol Emanuele</title>
    <script>
      (function () {
        var l = window.location;
        var redirect =
          l.pathname.replace(/\\/$/, "") +
          (l.search ? l.search.replace(/&/g, "~and~") : "") +
          l.hash;
        window.location.replace("/?/" + redirect);
      })();
    </script>
